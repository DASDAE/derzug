# Import layering, enforced by `tach check`.
#
# DerZug is heading toward a client/server split, so the node library and the
# workflow engine must stay runnable with no display attached. Layers are
# listed highest first; a module may import from its own layer and any layer
# below it, never above. See docs/dev/nodes.md.
#
#   interface  ->  Qt lives here and nowhere else
#   nodes      ->  what each node is: ports, params, task factory
#   engine     ->  the workflow engine
#   foundation ->  data models and Qt-free helpers
#
# `derzug.utils` is deliberately split module by module rather than placed
# whole: it holds both Qt-free parsing helpers the node layer needs and Qt
# widget helpers it must never reach.

source_roots = ["src"]
layers = ["interface", "nodes", "engine", "foundation"]
exclude = [
    "benchmarks",
    "build",
    "docs",
    "scripts",
    "tests",
    "worktrees",
    "**/__pycache__",
]

# -- interface: everything allowed to touch Qt --------------------------------

[[modules]]
path = "derzug.cli"
layer = "interface"

[[modules]]
path = "derzug.conductor"
layer = "interface"

[[modules]]
path = "derzug.core"
layer = "interface"

[[modules]]
path = "derzug.views"
